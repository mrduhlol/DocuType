<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocuType content harness</title>
    <style>
      body {
        margin: 0;
        background: #f6f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      #results {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 18px 22px;
        overflow: auto;
        background: #111418;
        color: #d9f2df;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        z-index: 10;
      }

      #results.failed {
        color: #ffc9bd;
      }
    </style>
    <script>
      (() => {
        "use strict";

        const listeners = [];
        const stub = {
          runtime: {
            onMessage: {
              addListener(listener) {
                listeners.push(listener);
              },
            },
          },
        };

        try {
          Object.defineProperty(window, "chrome", {
            configurable: true,
            writable: true,
            value: stub,
          });
        } catch {
          window.chrome = stub;
        }

        window.__docutypeListeners = listeners;
      })();
    </script>
  </head>
  <body>
    <pre id="results">BROWSER TESTS NOT RUN</pre>

    <script src="/lib/shared.js"></script>
    <script src="/lib/browser-api.js"></script>
    <script src="/content/typing-engine.js"></script>
    <script src="/content/docs-input.js"></script>
    <script src="/content/control-bar-styles.js"></script>
    <script src="/content/control-bar.js"></script>
    <script src="/content/content.js"></script>
    <script>
      (() => {
        "use strict";

        const resultsElement = document.getElementById("results");
        const listeners = window.__docutypeListeners;
        const shared = window.DocuType && window.DocuType.shared;
        const tests = [];
        let mock = null;

        function addTest(name, run) {
          tests.push({ name, run });
        }

        function assert(condition, message) {
          if (!condition) {
            throw new Error(message || "Assertion failed");
          }
        }

        function assertEqual(actual, expected, message) {
          if (actual !== expected) {
            throw new Error(
              message || `Expected ${JSON.stringify(expected)}, received ${JSON.stringify(actual)}`
            );
          }
        }

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function waitFor(predicate, message, timeout = 5000) {
          const started = performance.now();

          while (performance.now() - started < timeout) {
            if (predicate()) {
              return;
            }
            await sleep(25);
          }

          throw new Error(message || "Timed out waiting for the expected state");
        }

        function loadScript(path) {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = path;
            script.onload = () => resolve();
            script.onerror = () => reject(new Error(`Failed to load ${path}`));
            document.head.appendChild(script);
          });
        }

        async function loadContentBundle() {
          const files = [
            "/lib/shared.js",
            "/lib/browser-api.js",
            "/content/typing-engine.js",
            "/content/docs-input.js",
            "/content/control-bar-styles.js",
            "/content/control-bar.js",
            "/content/content.js",
          ];

          for (const file of files) {
            await loadScript(file);
          }
        }

        function dispatch(message) {
          const listener = listeners[0];
          assert(listener, "No content-script message listener is registered");

          let responded = false;
          let response = null;
          const returned = listener(message, { id: "docutype-test" }, (value) => {
            responded = true;
            response = value;
          });

          return { responded, response, returned };
        }

        function createMockDocs(options = {}) {
          const frame = document.createElement("iframe");
          frame.className = "docs-texteventtarget-iframe";
          frame.style.width = "1px";
          frame.style.height = "1px";
          document.body.appendChild(frame);

          const frameDocument = frame.contentDocument;
          frameDocument.body.innerHTML = '<div contenteditable="true"></div>';
          const editor = frameDocument.querySelector('[contenteditable="true"]');

          let text = "";
          let acceptPaste = options.acceptPaste !== false;
          let lastPasteHtml = null;

          editor.addEventListener("paste", (event) => {
            if (!acceptPaste) {
              return;
            }

            event.preventDefault();
            lastPasteHtml = event.clipboardData
              ? event.clipboardData.getData("text/html")
              : null;
            text += event.clipboardData
              ? event.clipboardData.getData("text/plain")
              : "";
          });

          editor.addEventListener("keypress", (event) => {
            if (event.key === "Enter" || event.charCode === 13) {
              text += "\n";
            } else if (event.key === " " || event.charCode === 32) {
              text += " ";
            } else if (event.charCode) {
              text += String.fromCharCode(event.charCode);
            }
          });

          return {
            frame,
            editor,
            getText: () => text,
            getLastPasteHtml: () => lastPasteHtml,
            setAcceptPaste: (value) => {
              acceptPaste = value;
            },
          };
        }

        function ensureMock(options) {
          if (!mock) {
            mock = createMockDocs(options);
          }
          return mock;
        }

        function barHost() {
          return document.querySelector("#docutype-root");
        }

        function barParts() {
          const host = barHost();
          if (!host || !host.shadowRoot) {
            return null;
          }

          const shadow = host.shadowRoot;
          return {
            shadow,
            panel: shadow.querySelector(".dt-bar"),
            status: shadow.querySelector('[data-role="status"]'),
            percent: shadow.querySelector('[data-role="percent"]'),
            count: shadow.querySelector('[data-role="count"]'),
            pause: shadow.querySelector('[data-action="pause"]'),
            stop: shadow.querySelector('[data-action="stop"]'),
            error: shadow.querySelector('[data-role="error"]'),
          };
        }

        function stopSession() {
          const parts = barParts();
          if (parts && parts.stop) {
            parts.stop.click();
          }
        }

        async function resetPage() {
          stopSession();
          await sleep(20);
          document.querySelectorAll("#docutype-root").forEach((node) => node.remove());
          if (mock) {
            mock.frame.remove();
            mock = null;
          }
        }

        const isDocsPage = Boolean(shared && shared.isGoogleDocsDocumentUrl(location.href));

        addTest("exposes the shared protocol constant", async () => {
          assert(shared, "Shared helpers are missing");
          assertEqual(shared.START_SESSION_MESSAGE, "DOCUTYPE_START_SESSION");
        });

        addTest("registers exactly one message listener", async () => {
          assertEqual(listeners.length, 1);
        });

        addTest("ignores unrelated messages", async () => {
          const result = dispatch({ type: "SOMETHING_ELSE" });
          assertEqual(result.responded, false, "Unrelated messages must not be answered");
        });

        addTest("stays single-listener after duplicate injection", async () => {
          await loadContentBundle();
          await loadContentBundle();
          assertEqual(listeners.length, 1, "Duplicate injection must not add listeners");
        });

        if (isDocsPage) {
          addTest("types the passage into the document, not the bar", async () => {
            const docs = ensureMock();
            const passage = "Hello there.";

            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: passage,
              wpm: 160,
            });

            assertEqual(result.responded, true, "Start must respond");
            assertEqual(result.response.ok, true, "Start should succeed on a Docs page");
            assertEqual(document.querySelectorAll("#docutype-root").length, 1);

            const parts = barParts();
            assert(parts, "The control bar should mount");
            assert(
              !parts.shadow.textContent.includes(passage),
              "The passage must not be rendered in the control bar"
            );

            await waitFor(
              () => docs.getText() === passage,
              `Document should receive the full passage; got ${JSON.stringify(docs.getText())}`
            );

            assertEqual(parts.status.textContent, "Complete");
            assertEqual(parts.percent.textContent, "100%");
            assertEqual(docs.getText(), passage);
          });

          addTest("pause freezes insertion and resume continues", async () => {
            const docs = ensureMock();
            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "abcdefghijklmnop",
              wpm: 30,
            });
            assertEqual(result.response.ok, true);

            await waitFor(() => docs.getText().length >= 1, "Typing should begin");
            barParts().pause.click();
            const pausedText = docs.getText();
            await sleep(700);
            assertEqual(docs.getText(), pausedText, "Pause must stop insertion");
            assertEqual(barParts().status.textContent, "Paused");

            barParts().pause.click();
            await waitFor(
              () => docs.getText().length > pausedText.length,
              "Resume should continue insertion"
            );
          });

          addTest("stop removes the bar and prevents further insertion", async () => {
            const docs = ensureMock();
            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "Stop this session.",
              wpm: 30,
            });
            assertEqual(result.response.ok, true);

            await waitFor(() => docs.getText().length >= 1, "Typing should begin");
            stopSession();
            assertEqual(barHost(), null, "Stop should remove the bar");

            const stoppedText = docs.getText();
            await sleep(700);
            assertEqual(docs.getText(), stoppedText, "Stopped sessions must not type");
          });

          addTest("replacement starts keep one bar and preserve inserted text", async () => {
            const docs = ensureMock();
            const first = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "first",
              wpm: 160,
            });
            assertEqual(first.response.ok, true);
            await waitFor(() => docs.getText().length >= 1, "First session should type");

            const firstHost = barHost();
            const second = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "second",
              wpm: 160,
            });
            assertEqual(second.response.ok, true);
            assertEqual(document.querySelectorAll("#docutype-root").length, 1);
            assert(barHost() !== firstHost, "Replacement should mount a fresh bar");
            assert(!firstHost.isConnected, "Replacement should remove the old bar");

            const before = docs.getText();
            await waitFor(
              () => docs.getText().length > before.length,
              "Replacement session should type"
            );
            assert(docs.getText().startsWith(before), "Earlier inserted text must remain");
          });

          addTest("invalid input does not disturb a running session", async () => {
            ensureMock();
            const start = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "A running session that must survive bad input.",
              wpm: 45,
            });
            assertEqual(start.response.ok, true);
            await waitFor(() => barHost() !== null, "Session should mount");

            const runningHost = barHost();
            const empty = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "   \n\t ",
              wpm: 45,
            });
            assertEqual(empty.response.ok, false);
            assertEqual(empty.response.code, "EMPTY_TEXT");

            const tooLong = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "a".repeat(shared.MAX_TEXT_LENGTH + 1),
              wpm: 45,
            });
            assertEqual(tooLong.response.ok, false);
            assertEqual(tooLong.response.code, "TEXT_TOO_LONG");

            assertEqual(barHost(), runningHost, "Rejected starts must not replace the bar");
          });

          addTest("missing editor is reported before a bar mounts", async () => {
            if (mock) {
              mock.frame.remove();
              mock = null;
            }

            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "No editor here.",
              wpm: 45,
            });

            assertEqual(result.response.ok, false);
            assertEqual(result.response.code, "EDITOR_NOT_FOUND");
            assertEqual(barHost(), null, "No bar may mount without an editor");
          });

          addTest("a rejected paste shows an error and stops", async () => {
            const docs = ensureMock({ acceptPaste: false });
            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "🙂abcdef",
              wpm: 160,
            });
            assertEqual(result.response.ok, true);

            await waitFor(
              () => {
                const parts = barParts();
                return Boolean(parts && parts.panel.dataset.state === "error");
              },
              "The bar should show a paste error"
            );

            const parts = barParts();
            assertEqual(parts.status.textContent, "Couldn't type");
            assert(parts.error.textContent.includes("rejected"), "The error should explain the paste");
            assertEqual(docs.getText(), "", "A rejected paste must not change the document");

            stopSession();
            assertEqual(barHost(), null);
          });
        } else {
          addTest("rejects starts outside a Docs document", async () => {
            const result = dispatch({
              type: shared.START_SESSION_MESSAGE,
              text: "This should never start.",
              wpm: 45,
            });

            assertEqual(result.responded, true, "Rejection must respond");
            assertEqual(result.response.ok, false);
            assertEqual(result.response.code, "NOT_DOCS");
            assertEqual(barHost(), null, "No bar may mount outside Docs");
          });
        }

        async function finish(records) {
          const failed = records.filter((record) => !record.ok);
          const lines = records.map((record) =>
            record.ok ? `✔ ${record.name}` : `✖ ${record.name}\n  ${record.error}`
          );

          resultsElement.classList.toggle("failed", failed.length > 0);
          resultsElement.textContent = `${lines.join("\n")}\n\n${
            failed.length ? "BROWSER TESTS FAILED" : "BROWSER TESTS PASSED"
          }`;
          resultsElement.setAttribute("data-status", failed.length ? "failed" : "passed");
        }

        async function main() {
          const records = [];
          for (const testCase of tests) {
            try {
              await testCase.run();
              records.push({ name: testCase.name, ok: true });
            } catch (error) {
              records.push({
                name: testCase.name,
                ok: false,
                error: error && error.stack ? error.stack : String(error),
              });
            } finally {
              await resetPage();
            }
          }

          await finish(records);
        }

        main().catch(async (error) => {
          await finish([
            {
              name: "content harness completed",
              ok: false,
              error: error && error.stack ? error.stack : String(error),
            },
          ]);
        });
      })();
    </script>
  </body>
</html>
